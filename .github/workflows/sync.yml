name: RAPTOR Sync lista

on:
  issues:
    types: [opened]

# stesso gruppo di fetch.yml: i due workflow non scrivono mai insieme
concurrency:
  group: raptor-portafoglio-fetch
  cancel-in-progress: false

jobs:
  sync:
    # solo issue "[SYNC]" aperte dal proprietario (il corpo non viene mai passato alla shell)
    if: github.event.issue.user.login == 'Giorgiogoldoni' && startsWith(github.event.issue.title, '[SYNC]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Aggiorna portafoglio.json dalla issue
        id: sync
        continue-on-error: true
        run: python sync_portafoglio.py

      - name: Installa dipendenze
        if: steps.sync.outcome == 'success'
        run: pip install yfinance

      - name: Scarica prezzi e segnali
        if: steps.sync.outcome == 'success'
        run: python fetch_data.py

      - name: Commit e push
        if: always() && steps.sync.outcome == 'success'
        run: |
          git config user.name  "RAPTOR Bot"
          git config user.email "raptor-bot@noreply.github.com"
          git add portafoglio.json raptor_portafoglio_live.json data/charts/
          git diff --staged --quiet || git commit -m "🔄 Sync lista portafoglio da issue #$ISSUE_NUMBER"
          git pull --rebase origin main
          git push
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}

      - name: Commenta e chiudi la issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          [ -f /tmp/sync_msg.txt ] || echo "❌ Errore imprevisto: controlla il log del workflow." > /tmp/sync_msg.txt
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/sync_msg.txt || true
          gh issue close "$ISSUE_NUMBER" || true
          # chiude eventuali [SYNC] precedenti rimaste aperte (workflow saltati)
          gh issue list --author Giorgiogoldoni --state open --limit 50 --search "[SYNC] in:title" --json number --jq '.[].number' | grep -vx "$ISSUE_NUMBER" | xargs -r -I{} gh issue close {} --comment "Superata da #$ISSUE_NUMBER" || true
