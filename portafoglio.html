<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAPTOR Portafoglio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="chart_widget.js"></script>
<style>
:root{--b:#dee2e6;--t:#212529;--t2:#495057;--t3:#868e96;--a:#1971c2;--g:#2f9e44;--r:#c92a2a;--o:#e67700;--bg2:#f8f9fa}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;color:var(--t);font:13px system-ui,sans-serif}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px;border-bottom:2px solid var(--b);position:sticky;top:0;background:#fff;z-index:50}
.top h1{font-size:18px;color:var(--a);margin-right:auto}
.btn{background:var(--bg2);border:1px solid var(--b);color:var(--t2);padding:5px 10px;border-radius:4px;cursor:pointer;font-size:12px;text-decoration:none}
.btn:hover{border-color:var(--a);color:var(--a)}.btn.g{background:#d3f9d8;border-color:var(--g);color:var(--g)}.btn.r{color:var(--r)}
.kpi{display:flex;gap:10px;padding:12px 16px;flex-wrap:wrap}
.kpi div{flex:1;min-width:120px;background:var(--bg2);border:1px solid var(--b);border-radius:6px;padding:8px 12px}
.kpi small{color:var(--t3);display:block;font-size:11px}.kpi b{font-size:18px}
.sec{padding:8px 16px}.flt{display:flex;gap:6px;margin-bottom:8px}.flt .btn.on{background:var(--a);color:#fff;border-color:var(--a)}
.w{overflow-x:auto}table{width:100%;border-collapse:collapse}
th{background:var(--bg2);border-bottom:2px solid var(--b);padding:6px 8px;text-align:left;font-size:11px;white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid #f1f3f5;white-space:nowrap}.n{text-align:right;font-variant-numeric:tabular-nums}
.tk{color:var(--a);font-weight:700;cursor:pointer;text-decoration:underline dotted}
.z{padding:2px 7px;border-radius:3px;font-size:10px;font-weight:700}.LONG{background:#d3f9d8;color:var(--g)}.USCITA{background:#ffe3e3;color:var(--r)}.WATCH{background:#f1f3f5;color:var(--t3)}
input.c{width:90px;border:1px solid var(--b);border-radius:3px;padding:3px 5px;text-align:right}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center}.ov.open{display:flex}
.md{background:#fff;border-radius:8px;padding:20px;width:440px;max-width:95vw}.md h3{margin-bottom:12px}
.md label{display:block;font-size:11px;color:var(--t3);margin:8px 0 3px}.md input{width:100%;border:1px solid var(--b);border-radius:4px;padding:6px 8px}
#sug{max-height:170px;overflow-y:auto;border:1px solid var(--b);border-radius:4px;margin-top:4px}#sug div{padding:5px 8px;cursor:pointer;font-size:12px}#sug div:hover{background:var(--bg2)}
.mb{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.nd{color:var(--t3)}
</style></head><body>
<div class="top"><h1>RAPTOR Portafoglio</h1><span id="ts" class="nd"></span>
<button class="btn" onclick="load()">Aggiorna</button><button class="btn g" onclick="openAdd()">+ Aggiungi</button>
<button class="btn" onclick="xl()">Excel</button><button class="btn" onclick="expJ()">Esporta JSON</button>
<button class="btn" onclick="document.getElementById('imp').click()">Importa JSON</button><input id="imp" type="file" accept=".json" hidden onchange="impJ(this)">
<a class="btn" href="regole.pdf" target="_blank">Regole</a></div>
<div class="kpi"><div><small>Posizioni</small><b id="kN">—</b></div><div><small>P&amp;L % medio (semplice, senza pesi)</small><b id="kP">—</b></div>
<div><small>Alert attivi (uscita o P&amp;L ≤ -10%)</small><b id="kA">—</b></div><div><small>Migliore</small><b id="kB">—</b></div><div><small>Peggiore</small><b id="kW">—</b></div></div>
<div class="sec"><div class="flt" id="flt"></div><div class="w"><table><thead><tr><th>Ticker</th><th>Nome</th><th>Carico</th><th>Prezzo</th><th>P&amp;L %</th><th>Zona</th><th>Score</th><th>RSI14</th><th>In corso da</th><th>1° pallino</th><th>N. pallini</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div>
<div class="sec"><details><summary style="cursor:pointer;font-weight:700">Storico posizioni chiuse (<span id="sN">0</span>)</summary><div class="w"><table><thead><tr><th>Ticker</th><th>Nome</th><th>Carico</th><th>Vendita</th><th>P&amp;L %</th><th>Aperta</th><th>Chiusa</th></tr></thead><tbody id="sb"></tbody></table></div></details></div>
<div class="ov" id="ovA" onclick="if(event.target===this)this.classList.remove('open')"><div class="md"><h3>Aggiungi titolo</h3>
<label>Cerca nell'elenco (ticker o nome) oppure scrivi il simbolo Yahoo, es. ABCD.MI</label><input id="q" oninput="sug()" autocomplete="off"><div id="sug"></div>
<label>Selezionato</label><input id="fy" placeholder="simbolo Yahoo" oninput="this.value=this.value.toUpperCase()">
<label>Prezzo di carico (vuoto = prezzo attuale)</label><input id="fc" type="number" step="0.0001"><label>Data acquisto</label><input id="fd" type="date">
<div class="mb"><button class="btn" onclick="document.getElementById('ovA').classList.remove('open')">Annulla</button><button class="btn g" onclick="add()">Salva</button></div></div></div>
<script>
const CHART_BASE='data/charts/',K='rptf_v1';let L=[],S=[],V={},U=null,F='TUTTI';
const $=i=>document.getElementById(i),sv=()=>{try{localStorage.setItem(K,JSON.stringify({L,S}))}catch(e){}};
const ZO={USCITA:0,LONG:1,WATCH:2},f=(x,d=2)=>x==null||isNaN(x)?'—':(+x).toFixed(d);
function tv(y){const m={MI:'MIL:',DE:'XETR:',PA:'EURONEXT:',L:'LSE:'},p=y.split('.');return 'https://www.tradingview.com/chart/?symbol='+(m[p[1]]||'MIL:')+p[0]}
async function load(){try{const r=await fetch('raptor_portafoglio_live.json?t='+Date.now());const d=await r.json();V={};(d.data||[]).forEach(x=>V[x.yahoo]=x);$('ts').textContent=d.timestamp_it||''}catch(e){$('ts').textContent='dati live non disponibili'}render()}
async function init(){let s=null;try{s=JSON.parse(localStorage.getItem(K))}catch(e){}
if(s&&s.L){L=s.L;S=s.S||[]}else{try{const d=await (await fetch('portafoglio.json')).json();L=d.posizioni||[];S=d.storico||[];sv()}catch(e){}}
$('flt').innerHTML=['TUTTI','LONG','WATCH','USCITA'].map(z=>`<button class="btn" data-z="${z}" onclick="F='${z}';render()">${z}</button>`).join('');load()}
function render(){let tot=0,n=0,al=0,b=null,w=null;
const rows=L.map((p,i)=>{const v=V[p.yahoo],px=v&&v.prezzo!=null?v.prezzo:null,pl=px!=null&&p.carico?(px/p.carico-1)*100:null,z=v?v.zona:null;
if(pl!=null){tot+=pl;n++;if(!b||pl>b.pl)b={y:p.yahoo,pl};if(!w||pl<w.pl)w={y:p.yahoo,pl}}
if(z==='USCITA'||(pl!=null&&pl<=-10))al++;return{p,i,v,px,pl,z}})
.filter(r=>F==='TUTTI'||r.z===F).sort((a,b)=>(ZO[a.z]??3)-(ZO[b.z]??3));
$('tb').innerHTML=rows.map(({p,i,v,px,pl,z})=>{const col=pl>=0?'var(--g)':'var(--r)',g=z==='LONG'&&v.entryDateISO?Math.floor((Date.now()-new Date(v.entryDateISO))/864e5)+'g':'—',
sc=v&&v.sarCount!=null?(v.sarBull?'#2f9e44':'#c92a2a'):'';
return `<tr><td><span class="tk" onclick="sch(${i})">${p.yahoo.split('.')[0]}</span></td><td title="${p.nome||''}">${(p.nome||'').slice(0,38)}</td>
<td class="n"><input class="c" type="number" step="0.0001" value="${p.carico}" onchange="car(${i},this.value)"></td>
<td class="n">${px!=null?f(px,4):'<span class="nd" title="Dato non disponibile: aggiungi il simbolo a portafoglio.json nel repo">n/d</span>'}</td>
<td class="n" style="color:${col};font-weight:700">${pl!=null?(pl>=0?'+':'')+f(pl)+'%':'—'}</td>
<td>${z?`<span class="z ${z}">${z}</span>`:'—'}</td><td class="n">${v?f(v.score,1):'—'}</td><td class="n">${v?f(v.rsi,1):'—'}</td><td class="n">${g}</td>
<td style="color:${sc}">${v&&v.sarDate?v.sarDate:'—'}</td><td class="n" style="color:${sc}">${v&&v.sarCount!=null?v.sarCount:'—'}</td>
<td><button class="btn" onclick="sch(${i})">Scheda</button> <a class="btn" href="${tv(p.yahoo)}" target="_blank">TV</a> <button class="btn" onclick="chiudi(${i})">Chiudi</button> <button class="btn r" onclick="rim(${i})">✕</button></td></tr>`}).join('')||'<tr><td colspan="12" class="nd" style="padding:24px;text-align:center">Nessun titolo — usa "+ Aggiungi"</td></tr>';
document.querySelectorAll('#flt .btn').forEach(x=>x.classList.toggle('on',x.dataset.z===F));
$('kN').textContent=L.length;$('kP').textContent=n?(tot/n>=0?'+':'')+f(tot/n)+'%':'—';$('kA').textContent=al;
$('kB').textContent=b?b.y.split('.')[0]+' '+f(b.pl,1)+'%':'—';$('kW').textContent=w?w.y.split('.')[0]+' '+f(w.pl,1)+'%':'—';
$('sN').textContent=S.length;$('sb').innerHTML=S.map(s=>{const pp=(s.vendita/s.carico-1)*100;return `<tr><td>${s.yahoo.split('.')[0]}</td><td>${(s.nome||'').slice(0,38)}</td><td class="n">${f(s.carico,4)}</td><td class="n">${f(s.vendita,4)}</td><td class="n" style="color:${pp>=0?'var(--g)':'var(--r)'}">${pp>=0?'+':''}${f(pp)}%</td><td>${s.data_acquisto||'—'}</td><td>${s.data_chiusura||'—'}</td></tr>`}).join('')}
function car(i,x){const c=parseFloat(x);if(c>0){L[i].carico=c;sv()}render()}
function sch(i){const p=L[i];openChartModal(p.yahoo,p.nome||p.yahoo);const h=document.getElementById('cwChartHeader');
if(h&&!$('cwTv')){const c=document.getElementById('cwCloseBtn'),mk=(id,t,u)=>{const a=document.createElement('a');a.id=id;a.className='cw-tf-btn';a.textContent=t;a.target='_blank';a.style.textDecoration='none';a.href=u;h.insertBefore(a,c);return a};mk('cwTv','TradingView','#');mk('cwRg','Regole','regole.pdf')}
if($('cwTv'))$('cwTv').href=tv(p.yahoo)}
function rim(i){if(confirm('Rimuovere '+L[i].yahoo+' dalla lista?')){L.splice(i,1);sv();render()}}
function chiudi(i){const p=L[i],v=V[p.yahoo],x=parseFloat((prompt('Prezzo di vendita di '+p.yahoo,v&&v.prezzo!=null?v.prezzo:'')||'').replace(',','.'));if(!(x>0))return;
S.unshift({yahoo:p.yahoo,nome:p.nome,carico:p.carico,vendita:x,data_acquisto:p.data_acquisto,data_chiusura:new Date().toISOString().slice(0,10)});L.splice(i,1);sv();render()}
async function openAdd(){$('q').value='';$('fy').value='';$('fc').value='';$('sug').innerHTML='';$('fd').value=new Date().toISOString().slice(0,10);$('ovA').classList.add('open');
if(!U){try{U=await (await fetch('universe.json')).json()}catch(e){U=[]}}$('q').focus()}
let sel=null;function sug(){const q=$('q').value.trim().toUpperCase();$('fy').value=q.includes('.')?q:'';sel=null;if(q.length<2||!U){$('sug').innerHTML='';return}
const m=U.filter(u=>u[0].toUpperCase().startsWith(q)||u[1].toUpperCase().includes(q)).slice(0,10);
$('sug').innerHTML=m.map((u,k)=>`<div onclick="pick(${U.indexOf(u)})"><b>${u[0]}</b> ${u[1]}</div>`).join('')}
function pick(k){sel=U[k];$('fy').value=sel[0];$('q').value=sel[0]+' — '+sel[1];$('sug').innerHTML='';const v=V[sel[0]];if(v&&v.prezzo!=null)$('fc').placeholder=v.prezzo}
function add(){const y=$('fy').value.trim().toUpperCase();if(!y.includes('.')){alert('Scegli un titolo dall\'elenco o scrivi il simbolo Yahoo con suffisso (es. XYZ.MI)');return}
if(L.some(p=>p.yahoo===y)){alert(y+' è già in lista');return}
const v=V[y],c=parseFloat($('fc').value)||(v&&v.prezzo);if(!(c>0)){alert('Nessun prezzo attuale disponibile: inserisci il prezzo di carico');return}
const u=U&&U.find(x=>x[0]===y);L.push({yahoo:y,nome:sel?sel[1]:(u?u[1]:''),carico:c,data_acquisto:$('fd').value});sv();$('ovA').classList.remove('open');render()}
function dl(n,b,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([b],{type:t}));a.download=n;a.click()}
function expJ(){dl('portafoglio.json',JSON.stringify({posizioni:L,storico:S},null,1),'application/json')}
function impJ(el){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.posizioni))throw 0;if(!confirm('Sostituire la lista attuale con '+d.posizioni.length+' titoli?'))return;L=d.posizioni;S=d.storico||[];sv();load()}catch(e){alert('File non valido')}};if(el.files[0])r.readAsText(el.files[0]);el.value=''}
function xl(){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(L.map(p=>{const v=V[p.yahoo]||{},px=v.prezzo;return{Ticker:p.yahoo,Nome:p.nome,Carico:p.carico,Prezzo:px,'P&L %':px!=null?+((px/p.carico-1)*100).toFixed(2):null,Zona:v.zona||'',Score:v.score,RSI14:v.rsi,'Data acquisto':p.data_acquisto}})),'Portafoglio');
XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(S),'Storico');XLSX.writeFile(wb,'RAPTOR_Portafoglio_'+new Date().toISOString().slice(0,10)+'.xlsx')}
init();setInterval(()=>{if(document.activeElement.tagName!=='INPUT')load()},3e5);
</script></body></html>
